<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#BA1B23" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Tiyatronot — Sahne Not Defteri &amp; Türk Tiyatrosu Kataloğu</title>
    <meta
      name="description"
      content="Tiyatronot (tiyatronot.com) — Yüksek kontrastlı Türk tiyatrosu kataloğu, kişisel sahne not defteri ve tiyatrosever topluluğu."
    />

    <!-- Self-hosted Newsreader (Latin + Latin-Ext) -->
    <link rel="stylesheet" href="/fonts/newsreader.css" />
    <!-- Anti-flicker Theme Initialization -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('tiyatronot_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-tn-page text-tn-text font-serif antialiased selection:bg-tn-red selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
